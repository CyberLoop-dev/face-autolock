<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="face-autolock banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#171132"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .scan { animation: scan 2.8s ease-in-out infinite alternate; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(170px); } }
  </style>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="230" cy="160" r="150" fill="url(#glow)"/>

  <!-- face detection frame -->
  <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 110 V70 H170"/>
    <path d="M290 70 H330 V110"/>
    <path d="M130 210 V250 H170"/>
    <path d="M290 250 H330 V210"/>
  </g>

  <!-- person -->
  <circle cx="230" cy="130" r="34" fill="none" stroke="#e2e8f0" stroke-width="5"/>
  <path d="M165 235 Q165 182 230 182 Q295 182 295 235" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>

  <!-- scanning line -->
  <rect class="scan" x="135" y="72" width="190" height="3" rx="2" fill="#00e5ff" opacity="0.85"/>

  <!-- lock badge -->
  <circle cx="320" cy="250" r="34" fill="#0b0f1a" stroke="url(#accent)" stroke-width="4"/>
  <path d="M311 247 v-6 a9 9 0 0 1 18 0 v6" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <rect x="306" y="247" width="28" height="22" rx="4" fill="#8b5cf6"/>
  <circle cx="320" cy="257" r="3" fill="#0b0f1a"/>

  <!-- text -->
  <text x="430" y="150" font-size="64" font-weight="700" fill="url(#accent)" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">face-autolock</text>
  <text x="432" y="200" font-size="26" fill="#cbd5e1" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Walk away. It locks. Look away. It doesn’t.</text>
  <text x="432" y="245" font-size="20" fill="#64748b" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">Python  •  OpenCV  •  Windows  •  100% offline</text>
</svg>
